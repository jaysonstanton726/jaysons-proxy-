<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101426">
  <title>Jaysons Proxy</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#151d33; --muted:#9aa8c7; --accent:#8b7cff; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; font-family:system-ui,-apple-system,Segoe UI,sans-serif; color:#f5f6ff;
      background:radial-gradient(ellipse at top,#27315c 0,#11182d 42%,var(--bg) 78%); }
    main { width:min(850px,92vw); margin:0 auto; padding:12vh 0 48px; text-align:center; }
    .tag { color:#b7b0ff; letter-spacing:.22em; font-size:.75rem; font-weight:700; }
    h1 { margin:.55rem 0 .4rem; font-size:clamp(2.5rem,8vw,4.5rem); letter-spacing:-.055em; }
    .sub { color:var(--muted); margin:0 0 2.2rem; }
    form { display:flex; gap:10px; padding:9px; background:#fff; border-radius:16px; box-shadow:0 18px 55px #0006; }
    input { flex:1; min-width:0; border:0; outline:0; padding:12px 14px; font-size:1rem; color:#17203a; background:transparent; }
    button { border:0; border-radius:11px; padding:0 20px; font-weight:700; color:white; background:var(--accent); cursor:pointer; }
    h2 { margin:3.3rem 0 1rem; font-size:1rem; color:#c6cce0; }
    .links { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:12px; }
    .links a { text-decoration:none; color:#f5f6ff; background:#ffffff0d; border:1px solid #ffffff18; border-radius:14px; padding:18px 12px; transition:.15s; }
    .links a:hover { background:#ffffff18; transform:translateY(-2px); }
    .links span { display:block; color:var(--muted); font-size:.8rem; margin-top:5px; }
    footer { margin-top:3rem; color:#8490ae; font-size:.78rem; line-height:1.6; }
    @media(max-width:480px) { main{padding-top:9vh} form{gap:5px} button{padding:0 13px} }
  </style>
</head>
<body>
  <main>
    <div class="tag">YOUR PERSONAL WEB PORTAL</div>
    <h1>Jaysons Proxy</h1>
    <p class="sub">A simple place to start your web browsing.</p>
    <form action="https://www.google.com/search" method="get">
      <input name="q" type="search" placeholder="Search the web…" aria-label="Search the web" required>
      <button type="submit">Search</button>
    </form>
    <h2>QUICK LINKS</h2>
    <nav class="links" aria-label="Quick links">
      <a href="https://www.google.com/">Google<span>Search</span></a>
      <a href="https://www.wikipedia.org/">Wikipedia<span>Knowledge</span></a>
      <a href="https://www.khanacademy.org/">Khan Academy<span>Learning</span></a>
      <a href="https://www.youtube.com/">YouTube<span>Videos</span></a>
    </nav>
    <footer>This is a personal start page. It does not hide browsing activity or bypass school network rules.</footer>
  </main>
</body>
</html>
